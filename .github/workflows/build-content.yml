name: Build incoming content

on:
  push:
    paths:
      - "incoming/**"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install converters
        run: npm install mammoth pdf-parse
      - name: Convert incoming documents
        run: node scripts/convert-incoming.mjs
      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content site.data.js incoming
          git diff --cached --quiet || git commit -m "Publish incoming content"
          git push
