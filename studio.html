<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio</title><link rel="stylesheet" href="../styles.css"><script src="https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.min.mjs" type="module"></script></head><body><main class="wrap section"><a class="back-link" href="../index.html">← Portfolio</a><span class="eyebrow">PRIVATE TOOL</span><h1>Content Studio</h1><p>Convert a DOCX or PDF into clean HTML locally in your browser. This creates a file for you to review before publishing. It does not provide authentication or publish directly to GitHub.</p><div class="form-card" style="padding:25px;border:1px solid var(--hair);border-radius:18px;background:rgba(255,255,255,.04)"><input id="file" type="file" accept=".docx,.pdf"><div class="studio-actions" style="margin-top:18px"><button class="btn btn-primary" id="go">Convert</button></div><pre id="out" style="white-space:pre-wrap;margin-top:18px"></pre></div></main><script>
const out=document.getElementById('out');document.getElementById('go').onclick=async()=>{const f=document.getElementById('file').files[0];if(!f)return out.textContent='Choose a DOCX or PDF first.';try{let html='';if(f.name.toLowerCase().endsWith('.docx')){const r=await f.arrayBuffer();html=(await mammoth.convertToHtml({arrayBuffer:r})).value;}else{const pdfjs=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.min.mjs');const pdf=await pdfjs.getDocument({data:await f.arrayBuffer()}).promise;for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i);const tc=await page.getTextContent();html+=`<h2>Page ${i}</h2><p>${tc.items.map(x=>x.str).join(' ')}</p>`;}}const blob=new Blob([`<section class="article-copy">${html}</section>`],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name.replace(/\.[^.]+$/,'')+'.html';a.click();out.textContent='Generated HTML. Review it, place it under content/writings/ or content/projects/, then add one entry to site.data.js.';}catch(e){out.textContent='Conversion failed: '+e.message;}}</script></body></html>
